<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player - {{ channel.name }} - Nano Stream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 900: '#111827', 950: '#030712' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

    <nav class="bg-gray-900 border-b border-gray-800 p-4">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="/" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </a>
                <h1 class="text-xl font-medium">{{ channel.name }}</h1>
            </div>
            {% if channel.status == 'active' %}
            <span class="flex items-center gap-2 text-sm text-emerald-500 bg-emerald-950/30 px-3 py-1 rounded-full border border-emerald-900">
                <span class="flex h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                LIVE
            </span>
            {% else %}
            <span class="text-sm text-gray-500 px-3 py-1 rounded-full border border-gray-800">OFFLINE</span>
            {% endif %}
        </div>
    </nav>

    <main class="flex-grow max-w-5xl w-full mx-auto p-4 flex flex-col items-center justify-center">
        
        <div class="w-full aspect-video bg-black rounded-xl overflow-hidden border border-gray-800 shadow-xl relative">
            <video id="video" class="w-full h-full" controls autoplay muted></video>
            
            {% if channel.status != 'active' %}
            <div class="absolute inset-0 flex items-center justify-center bg-black/80 backdrop-blur-sm">
                <div class="text-center">
                    <p class="text-xl text-gray-400 font-medium mb-4">Channel is offline</p>
                    <form action="/start/{{ channel.id }}" method="POST">
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-6 rounded-lg transition-colors">
                            Start Stream
                        </button>
                    </form>
                </div>
            </div>
            {% endif %}
        </div>

        <div class="w-full mt-6 bg-gray-900 rounded-xl p-4 border border-gray-800">
            <h3 class="text-sm text-gray-400 mb-2 font-medium">HLS Output URL</h3>
            <div class="flex">
                <input type="text" readonly value="{{ request.base_url }}hls/{{ channel.id }}/stream.m3u8" class="flex-grow bg-gray-950 border border-gray-800 rounded-l-lg px-4 py-2 font-mono text-sm focus:outline-none text-blue-400" id="urlInput">
                <button onclick="copyUrl()" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-r-lg border border-l-0 border-gray-800 transition-colors text-sm font-medium">
                    Copy
                </button>
            </div>
            <p class="text-xs text-gray-500 mt-3">
                You can use this URL in VLC Player, OBS Studio (Media Source), or any HLS compatible player.
            </p>
        </div>
    </main>

    <script>
        function copyUrl() {
            var copyText = document.getElementById("urlInput");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("URL Copied!");
        }

        {% if channel.status == 'active' %}
        var video = document.getElementById('video');
        var videoSrc = '/hls/{{ channel.id }}/stream.m3u8';
        
        // Wait a little bit for the first segment to be generated before playing
        setTimeout(() => {
            if (Hls.isSupported()) {
                var hls = new Hls({
                    debug: false,
                    manifestLoadingTimeOut: 10000,
                    // HLS.js Anti-Buffering Configuration
                    liveSyncDurationCount: 5,       // Start playback 5 segments behind live edge (safe buffer)
                    maxBufferLength: 60,            // Keep up to 60 seconds of video downloaded ahead
                    maxMaxBufferLength: 120,        // Absolute max buffer
                    liveMaxLatencyDurationCount: 15 // Allow up to 15 segments of latency before jumping
                });
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            }
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSrc;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }, 1500); // 1.5s delay to allow ffmpeg to write
        {% endif %}
    </script>
</body>
</html>
